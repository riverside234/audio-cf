# Python client profile for Qwen3.8-27B BF16 served with
# configs/vllm_server_qwen38.yaml.

client:
  base_url: "http://localhost:8000/v1"
  api_key: "EMPTY"
  model: "qwen3_8_27b"
  timeout_s: 120
  # Reduce to 32 if the BF16 checkpoint causes preemption or KV-cache pressure.
  client_max_inflight_requests: 64
  verify_ssl: true
  # Keep Qwen's model-family sampling fields; stage temperatures below follow
  # synthetic-data literature rather than general-chat defaults.
  extra_body:
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0

generation:
  response_format:
    type: "json_object"
  reasoning:
    enabled: true
    mode: "qwen3_vllm"
    # Low is sufficient for the short, schema-constrained grounding decisions.
    effort: "low"
    # Force Qwen to leave thinking mode early enough to emit the final JSON.
    # This is part of the 2048-token completion budget below.
    thinking_token_budget: 1024
    # Required as a compatibility fallback: some vLLM Qwen parser paths place
    # schema-constrained final JSON in message.reasoning with null content.
    # The client accepts it only when it is one complete JSON object.
    include_reasoning: true
    preserve_thinking: false
    strip_visible_reasoning: true
    reject_visible_reasoning: false
    instruction: >
      Use thinking mode to check caption evidence, evidence-source labels,
      target condition, explicit same-audio support or contradiction, and
      forbidden inferences. After thinking, return only the final JSON object
      that matches the schema.
  default:
    temperature: 0.5
    top_p: 0.95
    max_tokens: 2048
  claim_agent:
    # Moderate sampling preserves useful claim diversity.
    temperature: 0.7
    top_p: 0.95
    max_tokens: 2048
  qa_agent:
    # Grounded task generation favors Bonito's lower-temperature regime.
    temperature: 0.5
    top_p: 0.95
    max_tokens: 2048
  verifier_agent:
    # Verification is a fixed judgment, so use greedy decoding.
    temperature: 0.0
    top_p: 1.0
    max_tokens: 2048

retry:
  max_attempts: 3
  initial_delay_s: 1.0
  max_delay_s: 30.0
  backoff_multiplier: 2.0
  jitter_s: 0.25

agents:
  run_verifier: false
  max_validation_attempts: 2
  condition_sampling:
    strategy: "cycle"
    seed: 42
  prompts:
    claim_agent: "prompts/synthetic/claim_agent_v9.md"
    qa_agent: "prompts/synthetic/qa_agent_v7.md"
    verifier_agent: "prompts/synthetic/verifier_agent_v8.md"
  prompt_version: "claim_agent_v9+qa_agent_v7+verifier_agent_v8+qwen3.8_thinking_v3"

batching:
  runner_max_concurrency: 64
  unit_batch_size: 256
