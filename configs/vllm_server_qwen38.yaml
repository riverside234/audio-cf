# Qwen3.8-27B BF16 text-only server profile for:
#
#   VLLM_USE_V2_MODEL_RUNNER=0 vllm serve \
#     --config configs/vllm_server_qwen38.yaml
#
# Qwen3.8 requires Transformers >= 5.8.0 and vLLM >= 0.17.0.

model: "/data/not_backed_up/yxu209/models/qwen"
served-model-name: "qwen3_8_27b"
generation-config: "vllm"

host: "0.0.0.0"
port: 8000
uvicorn-log-level: "info"

# The BF16 checkpoint config makes auto resolve to BF16 without hard-coding it.
dtype: "auto"
# Leave room for the schema-heavy prompt, bounded thinking, and complete JSON.
max-model-len: 8192
gpu-memory-utilization: 0.90
max-num-seqs: 64
max-num-batched-tokens: 16384

enable-prefix-caching: true
enable-chunked-prefill: true

# Qwen3.8 emits <think>...</think>; qwen3 separates it from message.content.
reasoning-parser: "qwen3"

# This pipeline sends caption text only. Skip vision loading/profiling to leave
# more memory for KV cache and concurrent requests.
language-model-only: true

# Qwen3.8 ships a native multi-step MTP head. vLLM verifies draft tokens
# against the target model, so speculative decoding preserves its distribution.
speculative-config:
  method: "mtp"
  num_speculative_tokens: 3

tensor-parallel-size: 1
download-dir: "/data/not_backed_up/yxu209/huggingface/cache"

# trust-remote-code: false
