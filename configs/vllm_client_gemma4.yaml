# Python client profile for a Gemma 4 server started with
# configs/vllm_server_gemma4.yaml.

client:
  base_url: "http://localhost:8000/v1"
  api_key: "EMPTY"
  model: "gemma4"
  timeout_s: 120
  # Conservative starting point for one H100 80GB hosting Gemma 4 31B.
  # Lower this and runner concurrency to 16 if vLLM reports preemption.
  client_max_inflight_requests: 32
  verify_ssl: true
  # Retain the model-family top-k while using paper-calibrated temperatures.
  extra_body:
    top_k: 64

generation:
  # Fallback only. Each agent overrides this with its own JSON schema.
  response_format:
    type: "json_object"
  reasoning:
    enabled: true
    mode: "gemma4_vllm"
    # For Gemma 4, low/medium/high all enable thinking; they are not numeric caps.
    effort: "low"
    # vLLM forces Gemma's thought channel to end at this sampling budget.
    # This is part of the 2048-token completion budget below.
    thinking_token_budget: 1024
    include_reasoning: false
    strip_visible_reasoning: true
    reject_visible_reasoning: false
    instruction: >
      Before returning the final JSON, check caption evidence, evidence-source
      label, target condition, explicit same-audio support or contradiction,
      and forbidden inferences. Return only the final JSON object that matches
      the schema.
  default:
    temperature: 0.5
    top_p: 0.95
    max_tokens: 2048
  claim_agent:
    # Moderate sampling preserves useful claim diversity.
    temperature: 0.7
    top_p: 0.95
    max_tokens: 2048
  qa_agent:
    # Grounded task generation favors Bonito's lower-temperature regime.
    temperature: 0.5
    top_p: 0.95
    max_tokens: 2048
  verifier_agent:
    # Verification is a fixed judgment, so use greedy decoding.
    temperature: 0.0
    top_p: 1.0
    max_tokens: 2048

retry:
  max_attempts: 3
  initial_delay_s: 1.0
  max_delay_s: 30.0
  backoff_multiplier: 2.0
  jitter_s: 0.25

agents:
  run_verifier: false
  max_validation_attempts: 2
  condition_sampling:
    strategy: "cycle"
    seed: 42
  prompts:
    claim_agent: "prompts/synthetic/claim_agent_v5.md"
    qa_agent: "prompts/synthetic/qa_agent_v5.md"
    verifier_agent: "prompts/synthetic/verifier_agent_v5.md"
  prompt_version: "claim_agent_v5+qa_agent_v5+verifier_agent_v5+gemma4_thinking1024_v8"

batching:
  runner_max_concurrency: 32
  unit_batch_size: 256
