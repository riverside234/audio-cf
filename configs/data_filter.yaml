# High-throughput configuration for data_filter.py.
# "${cwd}" means the same current-working-directory behavior as os.getcwd().

input:
  manifest_path: "${cwd}/data/log/full_manifest.parquet"
  splits:
    - "development"

output:
  output_dir: "${cwd}/data/final"
  subset_jsonl: "subset_manifest.jsonl"
  subset_parquet: "subset_manifest.parquet"
  audio_units_jsonl: "audio_units.jsonl"
  audio_units_parquet: "audio_units.parquet"
  config_used: "filter_config_used.yaml"
  stats: "filter_stats.json"
  errors: "filter_errors.jsonl"
  # Parquet is the canonical handoff to data_synthetic.py. Skipping duplicate
  # JSONL avoids substantial serialization and disk IO on large runs.
  write_parquet: true
  write_jsonl: false

sampling:
  # Use all eligible development records and prepare a large generation pool.
  subset_size: 0
  unit_count: 100000
  audio_count: 2
  random_seed: 42
  grouping_strategy: "random"
  max_audio_reuse: null
  # Random grouping switches to direct sampling above this threshold instead
  # of materializing a large combinations list.
  max_enumerated_units: 100000

similarity:
  similarity_min: 0.10
  similarity_max: 1.00
  dissimilarity_max: 0.05

schema:
  grounding_standard: "caption_grounded"
  unit_schema_version: "audio_unit_manifest_v1"
  fallback_release_audio_root: "audio/clotho_v2_1"
  required_unit_columns:
    - "unit_id"
    - "schema_version"
    - "grounding_standard"
    - "audio_count"
    - "audio_ids"
    - "local_audio_paths"
    - "audio_file_names"
    - "audio_captions"

runtime:
  overwrite: false
  strict: false
