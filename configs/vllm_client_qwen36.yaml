# Python client profile for Qwen3.6-35B-A3B BF16 served with
# configs/vllm_server_qwen36.yaml.

client:
  base_url: "http://localhost:8000/v1"
  api_key: "EMPTY"
  model: "qwen3_5_moe"
  timeout_s: 120
  # Reduce to 32 if the BF16 checkpoint causes preemption or KV-cache pressure.
  client_max_inflight_requests: 64
  verify_ssl: true
  # Qwen's recommended precise-task thinking sampler. Thinking controls are
  # added by data_synthetic.py from generation.reasoning below.
  extra_body:
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0

generation:
  response_format:
    type: "json_object"
  reasoning:
    enabled: true
    mode: "qwen3_vllm"
    # Qwen3.6 uses a boolean thinking switch rather than reasoning_effort.
    effort: "medium"
    # Force Qwen to leave thinking mode early enough to emit the final JSON.
    # This is part of the 4096-token completion budget below.
    thinking_token_budget: 1024
    # Required as a compatibility fallback: some vLLM Qwen parser paths place
    # schema-constrained final JSON in message.reasoning with null content.
    # The client accepts it only when it is one complete JSON object.
    include_reasoning: true
    preserve_thinking: false
    strip_visible_reasoning: true
    reject_visible_reasoning: false
    instruction: >
      Use thinking mode to check caption evidence, evidence-source labels,
      target condition, counterfactual contradiction basis, and forbidden
      inferences. After thinking, return only the final JSON object that matches
      the schema.
  default:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4096
  claim_agent:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4096
  qa_agent:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4096
  verifier_agent:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4096

retry:
  max_attempts: 3
  initial_delay_s: 1.0
  max_delay_s: 30.0
  backoff_multiplier: 2.0
  jitter_s: 0.25

agents:
  run_verifier: false
  max_validation_attempts: 2
  condition_sampling:
    strategy: "cycle"
    seed: 42
  prompts:
    claim_agent: "prompts/synthetic/claim_agent_v2.md"
    qa_agent: "prompts/synthetic/qa_agent_v4.md"
    verifier_agent: "prompts/synthetic/verifier_agent_v4.md"
  prompt_version: "claim_agent_v2+qa_agent_v4+verifier_agent_v4+qwen3.6_thinking_v3"

batching:
  runner_max_concurrency: 64
  unit_batch_size: 256
