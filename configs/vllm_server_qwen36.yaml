# Qwen3.6-35B-A3B-FP8 text-only server profile for:
#
#   VLLM_USE_V2_MODEL_RUNNER=0 vllm serve \
#     --config configs/vllm_server_qwen36.yaml
#
# Qwen recommends vLLM >= 0.19.0; requirements.txt currently uses >= 0.25.1.

model: "/data/not_backed_up/yxu209/models/qwen"
served-model-name: "qwen3_5_moe"
generation-config: "vllm"

host: "0.0.0.0"
port: 8000
uvicorn-log-level: "info"

# The checkpoint declares its FP8 format; auto lets vLLM read that metadata.
dtype: "auto"
# Leave room for the schema-heavy prompt, bounded thinking, and complete JSON.
max-model-len: 8192
gpu-memory-utilization: 0.90
max-num-seqs: 64
max-num-batched-tokens: 16384

enable-prefix-caching: true
enable-chunked-prefill: true

# Qwen3.6 emits <think>...</think>; qwen3 separates it from message.content.
reasoning-parser: "qwen3"

# This pipeline sends caption text only. Skip vision loading/profiling to leave
# more memory for KV cache and concurrent requests.
language-model-only: true

# The checkpoint includes one native MTP layer. Current vLLM uses the generic
# mtp method; one speculative token avoids repeated forwards through that layer.
speculative-config:
  method: "mtp"
  num_speculative_tokens: 1

tensor-parallel-size: 1
download-dir: "/data/not_backed_up/yxu209/huggingface/cache"

# trust-remote-code: false
